spring.application.name=trustvault

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/trustvault
spring.datasource.username=root
spring.datasource.password=jeeva
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Flyway Database Migrations
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# Server Configuration
# ===============================
server.port=8084

# ===============================
# File Upload Limits
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Local development only. Set a strong secret in your environment.
trustvault.otp.hmac-secret=${TRUSTVAULT_OTP_HMAC_SECRET:local-only-change-this-secret-32chars}


# Gmail SMTP configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${TRUSTVAULT_MAIL_USERNAME}
spring.mail.password=${TRUSTVAULT_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.web.access=TRACE

# JWT configuration
trustvault.jwt.expiration-ms=900000
trustvault.jwt.secret=${TRUSTVAULT_JWT_SECRET}

trustvault.storage.location=./private-storage